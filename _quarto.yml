project:
  type: website
  output-dir: docs
  # OTHER_YAML guarda a configuração alternativa usada para gerar a versão em
  # PDF. Sem esta exclusão o Quarto renderizava OTHER_YAML/index-PDF.qmd como
  # uma página pública ("index-pdf"), que ia para o ar e entrava no sitemap.
  render:
    - "*.qmd"
    - "!OTHER_YAML/"

website:
  title: ""
  # O site-url precisa ser o domínio próprio: era o antigo github.io, e por
  # isso o sitemap declarava 20 endereços que redirecionavam em vez dos finais.
  site-url: https://henriquealvarenga.com/graficos
  description: "Visualização estatística para profissionais de saúde: gramática dos gráficos, princípios de Tufte e escolha do gráfico certo, com exemplos em R."
  repo-url: https://github.com/henriquealvarenga/graficos
