execute:
  freeze: auto
  warning: false
  message: false

bibliography: references/references.bib
csl: references/csl_styles/ABNT.csl

format:
  html:
    theme:
      light: [cosmo, custom.scss]
    canonical-url: true
    include-in-header:
      - file: _includes/autor.html
      - file: _includes/rodape.html
    toc: true
    toc-depth: 3
    toc-title: "Nesta página"
    code-fold: true
    code-tools: false
    code-summary: "Ver código R"
    code-overflow: wrap
    code-line-numbers: true
    lang: pt-BR
    lightbox: true
    smooth-scroll: true
    highlight-style: github
    fig-align: center
    fig-responsive: true

lang: pt-BR

knitr:
  opts_chunk:
    fig.width: 8
    fig.height: 5
    fig.retina: 2
    dpi: 150
    out.width: "100%"
